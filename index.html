<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Il Mio Sito 3D</title>
    <link rel="stylesheet" href="style.css">
    <!-- Script fondamentale di Google per leggere e animare i file .glb -->
    <script type="module" src="https://googleapis.com"></script>
</head>
<body>

    <header>
        <nav>
            <div class="logo">Futuro3D</div>
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">Progetti</a></li>
            </ul>
        </nav>
    </header>

    <main class="hero">
        <div class="hero-text">
            <h1>Benvenuto nel mio spazio 3D</h1>
            <p>Questo sito è stato creato da zero con l'Intelligenza Artificiale e ospita un modello 3D in formato GLB.</p>
            <button class="btn">Esplora</button>
        </div>
        
        <div class="hero-3d">
            <!-- Collegamento corretto al tuo file delle forbici -->
            <model-viewer src="barbers_scissors.glb" camera-controls auto-rotate shadow-intensity="1"></model-viewer>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
